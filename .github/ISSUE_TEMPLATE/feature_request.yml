name: Feature request
description: Propose an improvement to the API or synchronization app
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the use case and what is missing.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe how the API or synchronization app should behave.
    validations:
      required: true
