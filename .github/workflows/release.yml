name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to preview (never publishes)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Validate stable tag on master
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: python3 .github/scripts/release-notes.py validate --tag "$RELEASE_TAG"

  checks:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  notes:
    needs: [validate, checks]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.checks.result == 'success') }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Generate bilingual notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          RELEASE_NOTES_BASE_URL: ${{ secrets.RELEASE_NOTES_BASE_URL }}
          RELEASE_NOTES_MODEL: ${{ secrets.RELEASE_NOTES_MODEL }}
        run: python3 .github/scripts/release-notes.py generate --tag "$RELEASE_TAG"
      - name: Save notes for review or publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  image:
    needs: [validate, checks, notes]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable arm64 builds
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check an existing published version
        id: existing
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          if docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/image-index.json" 2> "$RUNNER_TEMP/inspect.err"; then
            python3 .github/scripts/verify-image.py "$RUNNER_TEMP/image-index.json" "$RELEASE_SHA"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif ! grep -Eiq 'not found|manifest unknown|name unknown|404' "$RUNNER_TEMP/inspect.err"; then
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish production image
        if: steps.existing.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          latest="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --target production --tag "$image" --tag "$latest" \
            --annotation "index:org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --push .
      - name: Verify the version image before the GitHub Release
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/image-index.json"
          python3 .github/scripts/verify-image.py "$RUNNER_TEMP/image-index.json" "$RELEASE_SHA"

  publish:
    needs: [validate, checks, notes, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - name: Create release once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; keeping its notes unchanged.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
