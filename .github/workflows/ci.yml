name: CI

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:34 Asia/Shanghai (19:34 UTC on the previous day).
    - cron: '34 19 * * *'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
        env:
          APP_ENV: testing
          DB_CONNECTION: testing
          CACHE_STORE: array

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    env:
      MIN_LINE_COVERAGE: '95'
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: |
          mkdir -p ci-data
          vendor/bin/phpunit --log-junit ci-data/junit.xml --coverage-clover ci-data/coverage.xml --coverage-html ci-data/coverage-html
        env:
          TEST_DB_CONNECTION: sqlite
          TEST_DB_DATABASE: ':memory:'

      - name: Collect SQLite metrics
        if: ${{ always() }}
        run: python3 .github/scripts/ci-summary.py collect sqlite '${{ job.status }}'

      - name: Upload SQLite metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-data-sqlite
          path: ci-data/sqlite.json
          retention-days: 7

      - name: Upload PHP coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage
          path: |
            ci-data/coverage.xml
            ci-data/coverage-html/
          if-no-files-found: ignore
          retention-days: 7

  postgres-test:
    name: PostgreSQL persistence (PHP 8.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wallpaper_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wallpaper_test -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: testing
      TEST_DB_CONNECTION: pgsql
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
      TEST_DB_DATABASE: wallpaper_api_test
      TEST_DB_USERNAME: wallpaper_test
      TEST_DB_PASSWORD: ''
      PGTZ: UTC
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit against an initially absent test database
        run: |
          mkdir -p ci-data
          vendor/bin/phpunit --log-junit ci-data/junit.xml

      - name: Verify migration rollback
        run: php artisan migrate:rollback --force

      - name: Collect PostgreSQL metrics
        if: ${{ always() }}
        run: python3 .github/scripts/ci-summary.py collect postgres-18 '${{ job.status }}'

      - name: Upload PostgreSQL metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-data-postgres-18
          path: ci-data/postgres-18.json
          retention-days: 7

  container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wallpaper_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wallpaper_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wallpaper_test -d wallpaper_smoke"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build production image from the lockfile
        run: docker build --pull --tag wallpaper-api:smoke .

      - name: Start a disposable production container
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          docker run --detach --name wallpaper-smoke --network host \
            --env APP_KEY --env DB_CONNECTION=pgsql --env DB_HOST=127.0.0.1 \
            --env DB_PORT=5432 --env DB_DATABASE=wallpaper_smoke \
            --env DB_USERNAME=wallpaper_test --env DB_PASSWORD= \
            --env DB_SSLMODE=disable wallpaper-api:smoke

      - name: Verify migrations, cached boot, queries and safe failures
        run: bash scripts/smoke-container.sh wallpaper-smoke

      - name: Show container logs on failure
        if: failure()
        run: |
          if docker container inspect wallpaper-smoke >/dev/null 2>&1; then
            docker logs wallpaper-smoke
          fi

      - name: Remove disposable container
        if: always()
        run: docker rm --force wallpaper-smoke || true

  result:
    name: CI result
    if: ${{ always() }}
    needs: [lint, test, postgres-test, container]
    runs-on: ubuntu-latest
    env:
      MIN_LINE_COVERAGE: '95'
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download CI metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: ci-data-*
          path: ci-data
          merge-multiple: true
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > ci-needs.json
          python3 .github/scripts/ci-summary.py render api
      - name: Require every check to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          POSTGRES_RESULT: ${{ needs.postgres-test.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          echo "Code Quality & Lint: $LINT_RESULT"
          echo "PHPUnit: $TEST_RESULT"
          echo "PostgreSQL persistence: $POSTGRES_RESULT"
          echo "Production container smoke test: $CONTAINER_RESULT"
          for result in "$LINT_RESULT" "$TEST_RESULT" "$POSTGRES_RESULT" "$CONTAINER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Every required job must succeed."
              exit 1
            fi
          done
