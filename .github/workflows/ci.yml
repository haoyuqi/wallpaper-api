name: CI

on:
  workflow_dispatch:
  schedule:
    # Daily at 07:00 Asia/Shanghai (23:00 UTC on the previous day).
    - cron: '0 23 * * *'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
        env:
          APP_ENV: testing
          DB_CONNECTION: testing
          CACHE_STORE: array

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  postgres-test:
    name: PostgreSQL persistence (PHP 8.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wallpaper_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wallpaper_test -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: testing
      TEST_DB_CONNECTION: pgsql
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5432'
      TEST_DB_DATABASE: wallpaper_api_test
      TEST_DB_USERNAME: wallpaper_test
      TEST_DB_PASSWORD: ''
      PGTZ: UTC
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.4-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit against an initially absent test database
        run: vendor/bin/phpunit

      - name: Verify migration rollback
        run: php artisan migrate:rollback --force

  container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wallpaper_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wallpaper_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wallpaper_test -d wallpaper_smoke"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build production image from the lockfile
        run: docker build --pull --tag wallpaper-api:smoke .

      - name: Start a disposable production container
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          docker run --detach --name wallpaper-smoke --network host \
            --env APP_KEY --env DB_CONNECTION=pgsql --env DB_HOST=127.0.0.1 \
            --env DB_PORT=5432 --env DB_DATABASE=wallpaper_smoke \
            --env DB_USERNAME=wallpaper_test --env DB_PASSWORD= \
            --env DB_SSLMODE=disable wallpaper-api:smoke

      - name: Verify migrations, cached boot, queries and safe failures
        run: bash scripts/smoke-container.sh wallpaper-smoke

      - name: Show container logs on failure
        if: failure()
        run: |
          if docker container inspect wallpaper-smoke >/dev/null 2>&1; then
            docker logs wallpaper-smoke
          fi

      - name: Remove disposable container
        if: always()
        run: docker rm --force wallpaper-smoke || true
