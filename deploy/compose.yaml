name: wallpaper

services:
  web:
    image: ghcr.io/haoyuqi/wallpaper-web:${WEB_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/haoyuqi/wallpaper-api:${API_VERSION:-latest}
    restart: unless-stopped
    environment: &api_environment
      APP_KEY: ${APP_KEY:?Set APP_KEY in deploy/.env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-wallpaper}
      DB_USERNAME: ${DB_USERNAME:-wallpaper}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  scheduler:
    image: ghcr.io/haoyuqi/wallpaper-api:${API_VERSION:-latest}
    restart: unless-stopped
    environment: *api_environment
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - scheduler_cache:/var/www/html/storage/framework/cache/data

  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    profiles: ["bundled-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-wallpaper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: ${DB_DATABASE:-wallpaper}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  scheduler_cache:
  postgres_data:
