ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    ErrorLog /proc/self/fd/2
    # Do not record raw query strings or client IPs in application access logs.
    CustomLog /proc/self/fd/1 "%m %U %>s %D"

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride All
        Require all granted
        LimitRequestBody 1048576
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
